# ═══════════════════════════════════════════════
# TMUX · CATPPUCCIN MOCHA · POWER-PILLS
# Ghostty · macOS · JetBrainsMono Nerd Font
# Requires tmux >= 3.2
# ═══════════════════════════════════════════════

# ── Terminal ────────────────────────────────────

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g history-limit 100000
set -g repeat-time 500
set -g display-time 1500

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S · #W"

# ── Prefix ──────────────────────────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ── Pane navigation ─────────────────────────────

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Pane management ─────────────────────────────

# Splits inherit current working directory
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"

# New window inherits current directory
bind c new-window -c "#{pane_current_path}"

bind x kill-pane
bind z resize-pane -Z

# Synchronize panes (status bar + borders turn orange while ON)
bind y set-window-option synchronize-panes \; display-message "Pane sync: #{?pane_synchronized,on,off}"

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window management ───────────────────────────

setw -g automatic-rename on

# Icon + name by running command. Shells show the current directory instead.
setw -g automatic-rename-format "#{?#{m/ri:^ssh$,#{pane_current_command}},󰣀 ssh,#{?#{m/ri:^n?vim?$,#{pane_current_command}}, #{pane_current_command},#{?#{m/ri:^(i?python[0-9.]*|uv|pytest)$,#{pane_current_command}}, #{pane_current_command},#{?#{m/ri:^(go|dlv|gopls)$,#{pane_current_command}}, #{pane_current_command},#{?#{m/ri:^(docker|podman|lazydocker)$,#{pane_current_command}}, #{pane_current_command},#{?#{m/ri:^(k9s|kubectl|helm|stern)$,#{pane_current_command}},󱃾 #{pane_current_command},#{?#{m/ri:^(btop|htop|top|iotop|ctop)$,#{pane_current_command}},󰍛 #{pane_current_command},#{?#{m/ri:^(git|lazygit|tig)$,#{pane_current_command}}, #{pane_current_command},#{?#{m/ri:^(zsh|bash|fish|sh)$,#{pane_current_command}}, #{b:pane_current_path}, #{pane_current_command}}}}}}}}}}"

setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# ── Copy mode ───────────────────────────────────

setw -g mode-keys vi

bind [ copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ═══════════════════════════════════════════════
# APPEARANCE · CATPPUCCIN MOCHA
# ═══════════════════════════════════════════════

# base     #1e1e2e   surface0 #313244   surface1 #45475a
# overlay0 #6c7086   subtext0 #a6adc8   text     #cdd6f4
# mauve    #cba6f7   lavender #b4befe   blue     #89b4fa
# sapphire #74c7ec   green    #a6e3a1   yellow   #f9e2af
# peach    #fab387   red      #f38ba8

# ── Mode-aware state (drives the left pill) ─────
#   prefix  -> yellow   copy-mode -> red
#   sync    -> peach    normal    -> mauve

set -g @mode_color "#{?client_prefix,#f9e2af,#{?pane_in_mode,#f38ba8,#{?pane_synchronized,#fab387,#cba6f7}}}"
set -g @mode_icon  "#{?client_prefix,,#{?pane_in_mode,,#{?pane_synchronized,,}}}"
set -g @mode_label "#{?client_prefix, · PREFIX,#{?pane_in_mode, · COPY,#{?pane_synchronized, · SYNC,}}}"

# ── Status bar ──────────────────────────────────

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-right-style "bg=#1e1e2e,fg=#a6adc8"

# ── Left: [mode+session] ────────────────────────

set -g status-left-length 60
set -g status-left " #[fg=#{E:@mode_color}]#[bg=#{E:@mode_color},fg=#1e1e2e,bold]#{E:@mode_icon} #[bg=#313244,fg=#cdd6f4,nobold] #S#{E:@mode_label} #[bg=#1e1e2e,fg=#313244] "

# ── Center: windows ─────────────────────────────

setw -g window-status-separator " "

# Reset built-in styles (default activity style is `reverse`)
setw -g window-status-style none
setw -g window-status-last-style none
setw -g window-status-activity-style none
setw -g window-status-bell-style none
setw -g window-status-current-style none

# Inactive: dim pill, bell/activity markers
setw -g window-status-format "#[fg=#313244]#[bg=#313244,fg=#6c7086] #I #[fg=#a6adc8]#W#{?window_bell_flag,#[fg=#f38ba8] ,}#{?window_activity_flag,#[fg=#fab387] ●,} #[bg=#1e1e2e,fg=#313244]"

# Current: lavender index block + bright name block
setw -g window-status-current-format "#[fg=#b4befe]#[bg=#b4befe,fg=#1e1e2e,bold] #I #[bg=#45475a,fg=#cdd6f4,nobold] #W#{?window_zoomed_flag, #[fg=#f9e2af],} #[bg=#1e1e2e,fg=#45475a]"

# ── Right: [ssh host] [load] [battery] [clock] ──
# Optional pills show up only when the terminal is wide enough, so nothing
# gets clipped:  >=120 cols: battery   >=140 cols: load + date

set -g status-right-length 120
set -g status-right ""

# SSH host pill (only while the active pane is running ssh)
set -ag status-right "#{?#{==:#{pane_current_command},ssh},#[fg=#f38ba8]#[bg=#f38ba8]#[fg=#1e1e2e]󰣀 #[bg=#313244]#[fg=#cdd6f4] #(~/.tmux/scripts/ssh-host.sh #{pane_tty}) #[bg=#1e1e2e]#[fg=#313244] ,}"

# Load average
set -ag status-right "#{?#{e|>=:#{client_width},140},#[fg=#fab387]#[bg=#fab387]#[fg=#1e1e2e] #[bg=#313244]#[fg=#cdd6f4] #(~/.tmux/scripts/load.sh) #[bg=#1e1e2e]#[fg=#313244] ,}"

# Battery (script prints the whole pill, nothing on machines without battery)
set -ag status-right "#{?#{e|>=:#{client_width},120},#(~/.tmux/scripts/battery.sh),}"

# Clock (date appears on wide terminals)
set -ag status-right "#[fg=#74c7ec]#[bg=#74c7ec,fg=#1e1e2e] #[bg=#313244,fg=#a6adc8]#{?#{e|>=:#{client_width},140}, %a %d %b,} #[fg=#cdd6f4,bold]%H:%M #[bg=#1e1e2e,fg=#313244,nobold] "

# ── Pane borders ────────────────────────────────
# Turn orange while synchronize-panes is on (anti-footgun for broadcast typing)

setw -g pane-border-status off
setw -g pane-border-lines single

setw -g pane-border-style "fg=#{?pane_synchronized,#fab387,#313244}"
setw -g pane-active-border-style "fg=#{?pane_synchronized,#fab387,#b4befe}"

# ── Copy mode appearance ────────────────────────

setw -g mode-style "fg=#1e1e2e,bg=#f9e2af"

# ── Messages, popups, menus ─────────────────────

set -g message-style "fg=#1e1e2e,bg=#b4befe,bold"
set -g message-command-style "fg=#1e1e2e,bg=#f9e2af,bold"

set -g popup-style "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style "fg=#b4befe"
set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#b4befe,fg=#1e1e2e,bold"
set -g menu-border-style "fg=#585b70"

set -g display-panes-active-colour "#b4befe"
set -g display-panes-colour "#585b70"

# ── Clock mode ──────────────────────────────────

setw -g clock-mode-colour "#b4befe"
setw -g clock-mode-style 24

# ═══════════════════════════════════════════════
# PLUGINS
# ═══════════════════════════════════════════════

set -g @plugin "tmux-plugins/tpm"

# Bootstrap TPM if missing
if-shell "test ! -d ~/.tmux/plugins/tpm" \
    "run-shell 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# TPM must be initialized last
run "~/.tmux/plugins/tpm/tpm"
